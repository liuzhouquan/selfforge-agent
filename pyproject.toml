[project]
name = "selfforge-agent"
version = "0.2.0"
description = "A Python Coding Agent with Reliable Execution and Self-Testing"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1"]

[project.scripts]
selfforge-agent = "selfforge_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selfforge_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a local Docker daemon and the sandbox image"]

[tool.ruff]
line-length = 100
target-version = "py311"
