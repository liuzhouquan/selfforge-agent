name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: SDD contract check
        run: uv run --no-sync python scripts/check_sdd.py

      - name: Unit tests
        run: uv run --no-sync pytest -q -m "not integration"

      - name: Build sandbox and locked dependency images
        run: |
          docker build -t selfforge-agent-sandbox:latest -f docker/Dockerfile .
          mkdir -p .local/wheelhouse/itsdangerous
          uv tool run --from pip pip download \
            --index-url https://pypi.org/simple \
            --only-binary=:all: \
            --require-hashes \
            --dest .local/wheelhouse/itsdangerous \
            -r docker/profiles/itsdangerous.lock
          uv run --no-sync selfforge-agent sandbox build \
            --requirements docker/profiles/itsdangerous.lock \
            --wheelhouse .local/wheelhouse/itsdangerous \
            --base-image selfforge-agent-sandbox:latest \
            --tag selfforge-itsdangerous:locked > .local/itsdangerous-image.json

      - name: Provision pinned evaluation sources
        run: uv run --no-sync python scripts/prepare_eval_sources.py --profile v3

      - name: Docker integration tests
        env:
          SELFFORGE_EVAL_IMAGE: selfforge-agent-sandbox:latest
        run: uv run --no-sync pytest -q -s -m integration
